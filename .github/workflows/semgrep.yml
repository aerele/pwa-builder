name: Semgrep

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Frappe Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semgrep
        run: pip install semgrep

      - name: Download Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules

      - name: Run semgrep
        run: semgrep scan --error --config /tmp/frappe-semgrep-rules/rules --config r/python.lang.correctness --baseline-commit ${{ github.event.pull_request.base.sha }}
